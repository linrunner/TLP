TLP_ENABLE=1
TLP_WARN_LEVEL=3
TLP_MSG_COLORS="91 93 1 92"
TLP_AUTO_SWITCH=2
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL
DISK_IDLE_SECS_ON_PRF=0
DISK_IDLE_SECS_ON_BAL=2
MAX_LOST_WORK_SECS_ON_PRF=15
MAX_LOST_WORK_SECS_ON_BAL=15
MAX_LOST_WORK_SECS_ON_SAV=15
CPU_ENERGY_PERF_POLICY_ON_PRF=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAL=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
PLATFORM_PROFILE_ON_PRF="balanced-performance performance"
PLATFORM_PROFILE_ON_BAL="balanced"
PLATFORM_PROFILE_ON_SAV="low-power cool quiet"
NMI_WATCHDOG=0
DISK_DEVICES="nvme0n1 sda"
DISK_APM_LEVEL_ON_PRF="254 254"
DISK_APM_LEVEL_ON_BAL="128 128"
DISK_APM_LEVEL_ON_SAV="128 128"
DISK_APM_CLASS_DENYLIST="usb ieee1394"
DISK_IOSCHED="keep keep"
SATA_LINKPWR_ON_PRF="med_power_with_dipm"
SATA_LINKPWR_ON_BAL="med_power_with_dipm"
SATA_LINKPWR_ON_SAV="med_power_with_dipm"
AHCI_RUNTIME_PM_ON_PRF=on
AHCI_RUNTIME_PM_ON_BAL=auto
AHCI_RUNTIME_PM_ON_SAV=auto
AHCI_RUNTIME_PM_TIMEOUT=15
PCIE_ASPM_ON_PRF=default
PCIE_ASPM_ON_BAL=default
PCIE_ASPM_ON_SAV=default
INTEL_GPU_POWER_PROFILE_ON_PRF=base
INTEL_GPU_POWER_PROFILE_ON_BAL=power_saving
INTEL_GPU_POWER_PROFILE_ON_SAV=power_saving
RADEON_DPM_PERF_LEVEL_ON_PRF=auto
RADEON_DPM_PERF_LEVEL_ON_BAL=auto
RADEON_DPM_PERF_LEVEL_ON_SAV=low
AMDGPU_ABM_LEVEL_ON_PRF=0
AMDGPU_ABM_LEVEL_ON_BAL=1
AMDGPU_ABM_LEVEL_ON_SAV=3
DEVFREQ_GOVERNOR_ON_PRF=
DEVFREQ_GOVERNOR_ON_BAL=
DEVFREQ_GOVERNOR_ON_SAV=
WIFI_PWR_ON_PRF=off
WIFI_PWR_ON_BAL=on
WIFI_PWR_ON_SAV=on
WOL_DISABLE=Y
SOUND_POWER_SAVE_ON_PRF=1
SOUND_POWER_SAVE_ON_BAL=1
SOUND_POWER_SAVE_ON_SAV=1
SOUND_POWER_SAVE_CONTROLLER=Y
BAY_POWEROFF_ON_PRF=0
BAY_POWEROFF_ON_BAL=0
BAY_DEVICE="sr0"
RUNTIME_PM_ON_PRF=on
RUNTIME_PM_ON_BAL=auto
RUNTIME_PM_ON_SAV=auto
RUNTIME_PM_DRIVER_DENYLIST="amdgpu mei_me nouveau nvidia xhci_hcd"
USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_PHONE=0
USB_EXCLUDE_PRINTER=1
USB_EXCLUDE_WWAN=0
RESTORE_THRESHOLDS_ON_BAT=1
NATACPI_ENABLE=1
TPSMAPI_ENABLE=1
